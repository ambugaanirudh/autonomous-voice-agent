<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Store - Checkout</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
  .nav a { text-decoration: none; color: #0066cc; }
  form { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
  label { font-weight: 600; display: flex; flex-direction: column; gap: 0.25rem; }
  input[type="text"], input[type="email"] { padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
  button.place-order { background: #0066cc; color: white; border: none; padding: 0.8rem; border-radius: 4px; font-size: 1rem; cursor: pointer; }
  button.place-order:disabled { background: #ccc; cursor: not-allowed; }
  .confirmation { display: none; margin-top: 2rem; padding: 1rem; background: #e8f5e9; border: 1px solid #4caf50; border-radius: 8px; }
</style>
</head>
<body>
  <nav class="nav"><a href="/store/cart.html">Back to Cart</a></nav>
  <h1>Checkout</h1>
  <form id="checkout-form">
    <label>Name <input type="text" name="name" required /></label>
    <label>Email <input type="email" name="email" required /></label>
    <label>Address <input type="text" name="address" required /></label>
    <button class="place-order" type="submit">Place Order</button>
  </form>
  <div class="confirmation" id="confirmation">
    <h2>Order Confirmed!</h2>
    <p id="confirmation-detail">Thank you for your purchase.</p>
  </div>
  <script>
    const form = document.getElementById("checkout-form");
    const confirmation = document.getElementById("confirmation");
    const detail = document.getElementById("confirmation-detail");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      detail.textContent = `Thank you ${formData.get("name")}! Your order has been placed.`;
      form.style.display = "none";
      confirmation.style.display = "block";
      localStorage.removeItem("mock_store_cart");
    });
  </script>
</body>
</html>
